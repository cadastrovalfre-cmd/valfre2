const TinyAPI={
  async getProds(pagina=1){
    try{
      /* Chama a API Route da Vercel — sem CORS, token fica seguro no servidor */
      const r=await fetch("/api/tiny-produtos?pagina="+pagina);
      const d=await r.json();
      return d;
    }catch(e){console.error("Tiny produtos:",e);return null;}
  },
  async getDetalhe(id){
    try{
      const r=await fetch("/api/tiny-produto-detalhe?id="+id);
      const d=await r.json();
      return d;
    }catch(e){console.error("Tiny detalhe:",e);return null;}
  },
  async getEstoque(id){
    try{
      const r=await fetch("/api/tiny-estoque?id="+id);
      const d=await r.json();
      return d?.retorno?.produto?.saldo??-1;
    }catch(e){console.error("Tiny estoque:",e);return -1;}

    /* Tiny retorna campos em snake_case */

          img=imgs.imagem[0].link||imgs.imagem[0].url||imgs.imagem[0].thumb||"";
        }
        /* Formato array direto: [{link}] */
        else if(Array.isArray(imgs)&&imgs.length>0){

};

/* ═══════════════════════════════════════════════
   MERCADO PAGO CHECKOUT
   Monta link de pagamento com os itens do carrinho.
   O cliente é redirecionado para o MP para pagar.
═══════════════════════════════════════════════ */
const MercadoPago={
  gerarLink(cart){
    /* Monta descrição resumida do carrinho */
    const itens=cart.map(i=>{
      const p=i.promotional_price>0&&i.promotional_price<i.price?i.promotional_price:i.price;
      return i.name.substring(0,30)+(i.quantity>1?" x"+i.quantity:"");
    }).join(", ");
    const total=cart.reduce((s,i)=>{
      const p=i.promotional_price>0&&i.promotional_price<i.price?i.promotional_price:i.price;
      return s+p*i.quantity;
    },0);
    const desc=encodeURIComponent("Ferramentas Valfre: "+itens.substring(0,200));
    const valor=total.toFixed(2);
    /* Link de pagamento do MP com valor e descrição */
    return "https://www.mercadopago.com.br/checkout/v1/redirect?pref_id=&amount="+valor+"&description="+desc+"&collector_id="+encodeURIComponent(CFG.MP_EMAIL);
  },
  abrirCheckout(cart){
    if(!cart||cart.length===0)return;
    const link=MercadoPago.gerarLink(cart);
    window.open(link,"_blank");
  }
};
