<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Outfit',sans-serif;background:#F8F6F3;color:#1A1A1A;-webkit-font-smoothing:antialiased}
.app-container{min-height:100vh;display:flex;flex-direction:column}
.top-bar{background:#122840;color:#fff;font-size:12px;padding:6px 0}
.top-bar-inner{max-width:1280px;margin:0 auto;padding:0 20px;display:flex;justify-content:space-between;align-items:center}
.top-bar a{color:#D1D1D1;text-decoration:none;display:flex;align-items:center;gap:4px;transition:color .2s}
.top-bar a:hover{color:#E87A1D}
.main-header{background:#1B3A5C;padding:12px 0;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.15)}
.header-inner{max-width:1280px;margin:0 auto;padding:0 20px;display:flex;align-items:center;gap:20px}
.logo-area{display:flex;align-items:center;gap:10px;cursor:pointer;flex-shrink:0}
.logo-text{font-weight:900;font-size:22px;color:#fff;line-height:1}
.logo-text span{color:#E87A1D}
.logo-sub{font-size:10px;color:#D1D1D1;font-weight:400;letter-spacing:2px;text-transform:uppercase}
.search-container{flex:1;max-width:600px;position:relative}
.search-input{width:100%;padding:12px 48px 12px 16px;border:2px solid transparent;border-radius:8px;font-size:14px;font-family:'Outfit',sans-serif;background:rgba(255,255,255,.12);color:#fff;outline:none;transition:all .3s}
.search-input::placeholder{color:rgba(255,255,255,.5)}
.search-input:focus{background:#fff;color:#1A1A1A;border-color:#E87A1D}
.search-input:focus::placeholder{color:#888}
.search-btn{position:absolute;right:4px;top:50%;transform:translateY(-50%);background:#E87A1D;border:none;color:#fff;width:38px;height:38px;border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s}
.search-btn:hover{background:#D06A10}
.header-actions{display:flex;align-items:center;gap:16px}
.header-action-btn{background:none;border:none;color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-family:'Outfit',sans-serif;opacity:.85;transition:opacity .2s;position:relative}
.header-action-btn:hover{opacity:1}
.cart-badge{position:absolute;top:-6px;right:-6px;background:#E87A1D;color:#fff;font-size:10px;font-weight:700;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.menu-toggle{display:none;background:none;border:none;color:#fff;cursor:pointer;padding:4px}
.category-nav{background:#fff;border-bottom:1px solid #E8E8E8;overflow-x:auto;-webkit-overflow-scrolling:touch}
.category-nav::-webkit-scrollbar{display:none}
.category-nav-inner{max-width:1280px;margin:0 auto;padding:0 20px;display:flex;align-items:stretch}
.cat-nav-item{padding:12px 16px;font-size:13px;font-weight:500;color:#444;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;transition:all .2s;display:flex;align-items:center;gap:6px;background:none;border-top:none;border-left:none;border-right:none;font-family:'Outfit',sans-serif}
.cat-nav-item:hover,.cat-nav-item.active{color:#E87A1D;border-bottom-color:#E87A1D;background:#FFF3E8}
.cat-nav-item.active{font-weight:600}
.main-content{max-width:1280px;margin:0 auto;padding:24px 20px;width:100%;flex:1}
.hero-banner{background:linear-gradient(135deg,#1B3A5C 0%,#122840 100%);border-radius:16px;padding:48px 40px;margin-bottom:32px;position:relative;overflow:hidden}
.hero-banner::before{content:'';position:absolute;right:-60px;top:-60px;width:300px;height:300px;background:#E87A1D;opacity:.08;border-radius:50%}
.hero-tag{display:inline-block;background:#E87A1D;color:#fff;font-size:12px;font-weight:700;padding:4px 12px;border-radius:20px;margin-bottom:16px;text-transform:uppercase;letter-spacing:1px}
.hero-title{font-size:36px;font-weight:800;color:#fff;margin-bottom:12px;line-height:1.1;max-width:600px}
.hero-subtitle{font-size:16px;color:rgba(255,255,255,.7);margin-bottom:24px;max-width:500px}
.hero-btn{display:inline-flex;align-items:center;gap:8px;background:#E87A1D;color:#fff;border:none;padding:14px 28px;border-radius:8px;font-size:15px;font-weight:600;font-family:'Outfit',sans-serif;cursor:pointer;transition:all .3s}
.hero-btn:hover{background:#D06A10;transform:translateY(-1px);box-shadow:0 4px 12px rgba(232,122,29,.3)}
.benefits-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:40px}
.benefit-item{display:flex;align-items:center;gap:12px;padding:16px;background:#fff;border-radius:12px;border:1px solid #E8E8E8}
.benefit-icon{width:44px;height:44px;border-radius:10px;background:#FFF3E8;display:flex;align-items:center;justify-content:center;color:#E87A1D;flex-shrink:0;font-size:20px}
.benefit-text h4{font-size:13px;font-weight:600;color:#1A1A1A;margin-bottom:2px}
.benefit-text p{font-size:11px;color:#888}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.section-title{font-size:22px;font-weight:700;color:#1B3A5C;display:flex;align-items:center;gap:8px}
.section-title::before{content:'';width:4px;height:24px;background:#E87A1D;border-radius:2px}
.section-link{color:#E87A1D;font-size:14px;font-weight:500;cursor:pointer;text-decoration:none;display:flex;align-items:center;gap:4px}
.section-link:hover{text-decoration:underline}
.product-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-bottom:40px}
.product-card{background:#fff;border-radius:12px;overflow:hidden;border:1px solid #E8E8E8;transition:all .3s;cursor:pointer;position:relative}
.product-card:hover{transform:translateY(-4px);box-shadow:0 8px 24px rgba(0,0,0,.1);border-color:#E87A1D}
.product-badge{position:absolute;top:12px;left:12px;background:#DC3545;color:#fff;font-size:11px;font-weight:700;padding:3px 8px;border-radius:4px;z-index:2}
.product-wishlist{position:absolute;top:12px;right:12px;background:#fff;border:none;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.1);z-index:2;color:#888;transition:all .2s}
.product-wishlist:hover{color:#DC3545}
.product-image-area{width:100%;aspect-ratio:1;background:#F5F5F5;display:flex;align-items:center;justify-content:center;overflow:hidden}
.product-image-area img{width:100%;height:100%;object-fit:cover}
.product-info{padding:16px}
.product-brand{font-size:11px;color:#888;font-weight:500;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.product-name{font-size:14px;font-weight:500;color:#1A1A1A;margin-bottom:8px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.product-old-price{font-size:12px;color:#888;text-decoration:line-through}
.product-price{font-size:20px;font-weight:700;color:#E87A1D}
.product-installments{font-size:11px;color:#888;margin-top:2px}
.product-add-btn{width:100%;padding:10px;background:#1B3A5C;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:600;font-family:'Outfit',sans-serif;cursor:pointer;transition:all .2s;margin-top:12px}
.product-add-btn:hover{background:#E87A1D}
.category-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-bottom:40px}
.category-card{background:#fff;border-radius:12px;padding:24px 16px;text-align:center;border:1px solid #E8E8E8;cursor:pointer;transition:all .3s}
.category-card:hover{border-color:#E87A1D;transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.06)}
.category-icon{font-size:32px;margin-bottom:8px}
.category-label{font-size:13px;font-weight:600;color:#1B3A5C;line-height:1.2}
.product-detail{display:grid;grid-template-columns:1fr 1fr;gap:40px;background:#fff;border-radius:16px;padding:32px;margin-bottom:32px}
.pd-image-area{aspect-ratio:1;background:#F5F5F5;border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.pd-image-area img{width:100%;height:100%;object-fit:cover;border-radius:12px}
.pd-info{display:flex;flex-direction:column}
.pd-breadcrumb{font-size:12px;color:#888;margin-bottom:8px;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.pd-breadcrumb span{cursor:pointer}
.pd-breadcrumb span:hover{color:#E87A1D}
.pd-brand{font-size:13px;color:#E87A1D;font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.pd-name{font-size:24px;font-weight:700;color:#1A1A1A;margin-bottom:8px;line-height:1.2}
.pd-sku{font-size:12px;color:#888;margin-bottom:16px}
.pd-stars{display:flex;gap:2px;margin-bottom:20px}
.pd-price-area{background:#F5F5F5;padding:20px;border-radius:12px;margin-bottom:20px}
.pd-old-price{font-size:14px;color:#888;text-decoration:line-through}
.pd-price{font-size:32px;font-weight:800;color:#E87A1D;margin-bottom:4px}
.pd-installments{font-size:14px;color:#444}
.pd-pix{margin-top:8px;font-size:13px;color:#28A745;font-weight:600}
.pd-stock{font-size:13px;margin-bottom:16px;display:flex;align-items:center;gap:6px;color:#28A745}
.pd-stock .dot{width:8px;height:8px;border-radius:50%;background:#28A745}
.pd-buttons{display:flex;gap:12px;margin-bottom:20px}
.pd-add-cart{flex:1;padding:14px;background:#E87A1D;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;font-family:'Outfit',sans-serif;cursor:pointer;transition:all .2s}
.pd-add-cart:hover{background:#D06A10;transform:translateY(-1px);box-shadow:0 4px 12px rgba(232,122,29,.3)}
.pd-buy-now{flex:1;padding:14px;background:#1B3A5C;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;font-family:'Outfit',sans-serif;cursor:pointer;transition:all .2s}
.pd-buy-now:hover{background:#122840}
.pd-desc{font-size:14px;line-height:1.6;color:#444;border-top:1px solid #E8E8E8;padding-top:20px}
.pd-desc h3{font-size:16px;font-weight:600;color:#1B3A5C;margin-bottom:8px}
.cart-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:200;opacity:0;pointer-events:none;transition:opacity .3s}
.cart-overlay.open{opacity:1;pointer-events:auto}
.cart-sidebar{position:fixed;top:0;right:-420px;bottom:0;width:400px;max-width:100%;background:#fff;z-index:201;display:flex;flex-direction:column;transition:right .3s;box-shadow:-4px 0 24px rgba(0,0,0,.15)}
.cart-sidebar.open{right:0}
.cart-header{padding:20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #E8E8E8}
.cart-header h2{font-size:18px;font-weight:700;color:#1B3A5C}
.cart-close{background:none;border:none;cursor:pointer;color:#444;padding:4px;font-size:24px}
.cart-items{flex:1;overflow-y:auto;padding:16px 20px}
.cart-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid #F5F5F5}
.cart-item-img{width:64px;height:64px;border-radius:8px;background:#F5F5F5;flex-shrink:0;overflow:hidden}
.cart-item-img img{width:100%;height:100%;object-fit:cover}
.cart-item-info{flex:1}
.cart-item-name{font-size:13px;font-weight:500;margin-bottom:4px}
.cart-item-price{font-size:15px;font-weight:700;color:#E87A1D}
.cart-item-actions{display:flex;align-items:center;gap:8px;margin-top:6px}
.cart-item-qty{display:flex;align-items:center;border:1px solid #D1D1D1;border-radius:6px;overflow:hidden}
.cart-item-qty button{width:28px;height:28px;border:none;background:#F5F5F5;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px}
.cart-item-qty span{width:32px;text-align:center;font-size:13px;font-weight:600}
.cart-item-remove{background:none;border:none;color:#DC3545;cursor:pointer;padding:4px;font-size:18px}
.cart-footer{padding:20px;border-top:1px solid #E8E8E8}
.cart-total{display:flex;justify-content:space-between;margin-bottom:16px}
.cart-total-label{font-size:16px;font-weight:500}
.cart-total-value{font-size:22px;font-weight:800;color:#E87A1D}
.cart-checkout-btn{width:100%;padding:14px;background:#E87A1D;color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:700;font-family:'Outfit',sans-serif;cursor:pointer;transition:all .2s;margin-bottom:8px}
.cart-checkout-btn:hover{background:#D06A10}
.cart-continue{width:100%;padding:12px;background:none;color:#1B3A5C;border:2px solid #1B3A5C;border-radius:10px;font-size:14px;font-weight:600;font-family:'Outfit',sans-serif;cursor:pointer;transition:all .2s}
.cart-continue:hover{background:#1B3A5C;color:#fff}
.cart-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#888;gap:12px}
.cart-empty span{font-size:48px}
.whatsapp-float{position:fixed;bottom:24px;right:24px;width:56px;height:56px;background:#25D366;color:#fff;border:none;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 16px rgba(37,211,102,.4);z-index:150;transition:all .3s;text-decoration:none}
.whatsapp-float:hover{transform:scale(1.1);box-shadow:0 6px 20px rgba(37,211,102,.5)}
.footer{background:#122840;color:#fff;padding:48px 0 0;margin-top:auto}
.footer-inner{max-width:1280px;margin:0 auto;padding:0 20px;display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:40px}
.footer-brand h3{font-size:24px;font-weight:800;margin-bottom:12px}
.footer-brand h3 span{color:#E87A1D}
.footer-brand p{font-size:13px;color:rgba(255,255,255,.6);line-height:1.6;margin-bottom:12px}
.footer-social{display:flex;gap:12px}
.footer-social a{width:40px;height:40px;border-radius:8px;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;color:#fff;text-decoration:none;transition:all .2s}
.footer-social a:hover{background:#E87A1D}
.footer-col h4{font-size:14px;font-weight:700;margin-bottom:16px;text-transform:uppercase;letter-spacing:1px;color:#E87A1D}
.footer-col ul{list-style:none}
.footer-col li{margin-bottom:10px}
.footer-col a{color:rgba(255,255,255,.6);text-decoration:none;font-size:13px;transition:color .2s;cursor:pointer}
.footer-col a:hover{color:#E87A1D}
.footer-bottom{border-top:1px solid rgba(255,255,255,.1);padding:20px 0;margin-top:40px;text-align:center}
.footer-bottom p{font-size:12px;color:rgba(255,255,255,.4);max-width:1280px;margin:0 auto;padding:0 20px}
.mobile-menu-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:300;opacity:0;pointer-events:none;transition:opacity .3s}
.mobile-menu-overlay.open{opacity:1;pointer-events:auto}
.mobile-menu{position:fixed;top:0;left:-300px;bottom:0;width:280px;background:#fff;z-index:301;transition:left .3s;overflow-y:auto}
.mobile-menu.open{left:0}
.mobile-menu-header{background:#1B3A5C;padding:20px;display:flex;align-items:center;justify-content:space-between}
.mobile-menu-header h3{color:#fff;font-size:16px}
.mobile-menu-close{background:none;border:none;color:#fff;cursor:pointer;font-size:24px}
.mobile-cat-item{width:100%;display:flex;align-items:center;justify-content:space-between;padding:12px 20px;font-size:14px;font-weight:500;color:#444;border:none;background:none;cursor:pointer;font-family:'Outfit',sans-serif;text-align:left;transition:background .2s}
.mobile-cat-item:hover{background:#FFF3E8;color:#E87A1D}
.mobile-cat-children{background:#F5F5F5}
.mobile-cat-child{display:block;width:100%;padding:10px 20px 10px 40px;font-size:13px;color:#444;border:none;background:none;cursor:pointer;font-family:'Outfit',sans-serif;text-align:left}
.mobile-cat-child:hover{color:#E87A1D}
.mobile-menu-links{border-top:1px solid #E8E8E8;padding:12px 0}
.mobile-link{display:block;width:100%;padding:12px 20px;font-size:14px;color:#444;border:none;background:none;cursor:pointer;font-family:'Outfit',sans-serif;text-align:left}
.mobile-link:hover{background:#FFF3E8;color:#E87A1D}
.policy-page{background:#fff;border-radius:16px;padding:40px;margin-bottom:32px}
.policy-page h1{font-size:28px;font-weight:800;color:#1B3A5C;margin-bottom:24px;padding-bottom:16px;border-bottom:3px solid #E87A1D}
.policy-page h2{font-size:18px;font-weight:700;color:#1B3A5C;margin:24px 0 12px}
.policy-page p{font-size:14px;line-height:1.8;color:#444;margin-bottom:12px}
.policy-page ul{padding-left:24px;margin-bottom:12px}
.policy-page li{font-size:14px;line-height:1.8;color:#444;margin-bottom:4px}
.back-btn{display:inline-flex;align-items:center;gap:6px;background:none;border:none;color:#1B3A5C;font-size:14px;font-weight:500;cursor:pointer;margin-bottom:16px;font-family:'Outfit',sans-serif;padding:8px 12px;border-radius:8px;transition:all .2s}
.back-btn:hover{background:#FFF3E8;color:#E87A1D}
.category-page-layout{display:grid;grid-template-columns:240px 1fr;gap:24px}
.filter-sidebar{background:#fff;border-radius:12px;padding:20px;border:1px solid #E8E8E8;height:fit-content;position:sticky;top:100px}
.filter-title{font-size:16px;font-weight:700;color:#1B3A5C;margin-bottom:16px}
.filter-group{margin-bottom:20px}
.filter-group h4{font-size:13px;font-weight:600;color:#444;margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px}
.filter-option{display:flex;align-items:center;gap:8px;padding:6px 0;cursor:pointer;font-size:13px;color:#444}
.filter-option input{accent-color:#E87A1D}
.sort-select{padding:8px 12px;border:1px solid #D1D1D1;border-radius:8px;font-family:'Outfit',sans-serif;font-size:13px;color:#444;background:#fff;cursor:pointer;width:100%}
@media(max-width:1024px){
  .product-grid{grid-template-columns:repeat(3,1fr)}
  .category-grid{grid-template-columns:repeat(3,1fr)}
  .footer-inner{grid-template-columns:repeat(2,1fr)}
  .benefits-bar{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:768px){
  .top-bar{display:none}
  .menu-toggle{display:flex}
  .header-actions .header-action-btn>span.label-text{display:none}
  .search-container{display:none}
  .header-inner{gap:12px}
  .logo-text{font-size:18px}
  .logo-sub{font-size:8px}
  .category-nav{display:none}
  .product-grid{grid-template-columns:repeat(2,1fr);gap:12px}
  .category-grid{grid-template-columns:repeat(2,1fr);gap:12px}
  .benefits-bar{grid-template-columns:1fr;gap:8px}
  .hero-banner{padding:28px 20px;border-radius:12px}
  .hero-title{font-size:24px}
  .hero-subtitle{font-size:14px}
  .product-detail{grid-template-columns:1fr;gap:20px;padding:20px}
  .pd-price{font-size:26px}
  .pd-buttons{flex-direction:column}
  .category-page-layout{grid-template-columns:1fr}
  .filter-sidebar{position:static}
  .footer-inner{grid-template-columns:1fr;gap:24px}
  .main-content{padding:16px}
  .policy-page{padding:20px}
  .policy-page h1{font-size:22px}
  .section-title{font-size:18px}
}
@media(max-width:480px){
  .product-grid{grid-template-columns:repeat(2,1fr);gap:8px}
  .product-info{padding:10px}
  .product-name{font-size:12px}
  .product-price{font-size:16px}
  .product-add-btn{padding:8px;font-size:12px}
}
</style>

<div id="root"></div>
<script type="text/babel">
// ============================================================
// CONFIG — PREENCHA COM SEUS DADOS DA TRAY
// ============================================================

    try {
      const url = CONFIG.TRAY_API_URL + "/web_api/products/?access_token=" + CONFIG.TRAY_ACCESS_TOKEN + "&limit=" + (params.limit||20);

      return await res.json();

  getCheckoutURL(sessionId) {
    return CONFIG.TRAY_API_URL + "/loja/carrinho.php?loja=" + CONFIG.TRAY_STORE_ID + "&transID=" + sessionId;
  }
};

function ProductCard({product, onClick, onAddToCart}) {
  const hasPromo = product.promotional_price > 0 && product.promotional_price < product.price;
  const discount = hasPromo ? Math.round((1 - product.promotional_price / product.price) * 100) : 0;
  const dp = hasPromo ? product.promotional_price : product.price;
  const inst = Math.min(12, Math.max(1, Math.floor(dp / 20)));
  return (
    <div className="product-card" onClick={() => onClick(product)}>
      {hasPromo && <div className="product-badge">-{discount}%</div>}
      <button className="product-wishlist" onClick={e=>{e.stopPropagation()}}><Ico.Heart/></button>
      <div className="product-image-area"><img src={getProductImage(product)} alt={product.name} loading="lazy"/></div>
      <div className="product-info">
        <div className="product-brand">{product.brand}</div>
        <div className="product-name">{product.name}</div>
        {hasPromo && <div className="product-old-price">{formatPrice(product.price)}</div>}
        <div className="product-price">{formatPrice(dp)}</div>
        {inst > 1 && <div className="product-installments">até {inst}x de {formatPrice(dp/inst)}</div>}
        <button className="product-add-btn" onClick={e=>{e.stopPropagation();onAddToCart(product)}}>Adicionar ao Carrinho</button>
      </div>
    </div>
  );
}

function App() {
  const [page, setPage] = React.useState("home");
  const [selCat, setSelCat] = React.useState(null);
  const [selProd, setSelProd] = React.useState(null);
  const [cart, setCart] = React.useState([]);
  const [cartOpen, setCartOpen] = React.useState(false);
  const [mobileMenu, setMobileMenu] = React.useState(false);
  const [search, setSearch] = React.useState("");
  const [searchRes, setSearchRes] = React.useState(null);
  const [expandedCats, setExpandedCats] = React.useState({});
  const [sortBy, setSortBy] = React.useState("relevance");
  const [products, setProducts] = React.useState(DEMO_PRODUCTS);
  const [trayOk, setTrayOk] = React.useState(false);

  React.useEffect(() => {
    if (CONFIG.TRAY_API_URL && CONFIG.TRAY_ACCESS_TOKEN) {
      TrayAPI.getProducts().then(d => { if(d && d.Products){ setProducts(d.Products.map(p=>p.Product)); setTrayOk(true); }});
    }
  }, []);

  const nav = (p, data) => { setPage(p); if(p==="category")setSelCat(data); if(p==="product")setSelProd(data); if(p==="search")setSearchRes(data); setMobileMenu(false); window.scrollTo({top:0,behavior:"smooth"}); };

  const addToCart = (product) => {
    setCart(prev => { const ex = prev.find(i=>i.id===product.id); if(ex) return prev.map(i=>i.id===product.id?{...i,quantity:i.quantity+1}:i); return [...prev,{...product,quantity:1}]; });
    setCartOpen(true);
  };
  const updateQty = (id,d) => setCart(prev => prev.map(i=>i.id===id?{...i,quantity:Math.max(0,i.quantity+d)}:i).filter(i=>i.quantity>0));
  const removeItem = (id) => setCart(prev => prev.filter(i=>i.id!==id));
  const cartTotal = cart.reduce((s,i) => { const p = i.promotional_price>0 && i.promotional_price<i.price ? i.promotional_price : i.price; return s+p*i.quantity; }, 0);
  const cartCount = cart.reduce((s,i) => s+i.quantity, 0);

  const doSearch = () => {
    if(!search.trim()) return;
    const q = search.toLowerCase();
    const r = products.filter(p => p.name.toLowerCase().includes(q) || (p.brand && p.brand.toLowerCase().includes(q)));
    nav("search", r);
  };

  const handleCheckout = () => {
    if(trayOk){ window.open(TrayAPI.getCheckoutURL("session"),"_blank"); }
    else { alert("Configure a integração com a Tray Commerce para finalizar compras.\n\nPreencha TRAY_API_URL, TRAY_ACCESS_TOKEN e TRAY_STORE_ID no código."); }
  };

  const getFiltered = (catId) => {
    const cat = CATEGORIES.find(c=>c.id===catId);
    if(!cat) return [];
    const ids = [catId, ...cat.children.map(ch=>ch.id)];
    let f = products.filter(p=>ids.includes(p.category_id));
    if(sortBy==="price-asc") f.sort((a,b)=>a.price-b.price);
    if(sortBy==="price-desc") f.sort((a,b)=>b.price-a.price);
    if(sortBy==="name") f.sort((a,b)=>a.name.localeCompare(b.name));
    return f;
  };

  const policyPages = ["termos-de-uso","politica-de-privacidade","politica-de-trocas","politica-de-entrega","politica-de-pagamento"];

  return (
    <div className="app-container">
      {/* TOP BAR */}
      <div className="top-bar"><div className="top-bar-inner">
        <div style={{display:"flex",gap:20,alignItems:"center"}}>
          <a href={CONFIG.WHATSAPP_URL} target="_blank"><Ico.Phone/> (27) 99825-5545</a>
          <a href={CONFIG.INSTAGRAM_URL} target="_blank"><Ico.IG/> {CONFIG.INSTAGRAM}</a>
        </div>
        <div style={{display:"flex",gap:16,fontSize:11}}>
          <span style={{cursor:"pointer",color:"#D1D1D1"}} onClick={()=>nav("politica-de-entrega")}>Rastrear Pedido</span>
          <span style={{color:"rgba(255,255,255,.3)"}}>|</span>
          <span style={{cursor:"pointer",color:"#D1D1D1"}} onClick={()=>nav("politica-de-pagamento")}>Central de Ajuda</span>
        </div>
      </div></div>

      {/* HEADER */}
      <header className="main-header"><div className="header-inner">
        <button className="menu-toggle" onClick={()=>setMobileMenu(true)}><Ico.Menu/></button>
        <div className="logo-area" onClick={()=>nav("home")}><div><div className="logo-text"><span>VAL</span>FRE</div><div className="logo-sub">Ferramentas</div></div></div>
        <div className="search-container">
          <input className="search-input" placeholder="O que você está procurando?" value={search} onChange={e=>setSearch(e.target.value)} onKeyDown={e=>e.key==="Enter"&&doSearch()}/>
          <button className="search-btn" onClick={doSearch}><Ico.Search/></button>
        </div>
        <div className="header-actions">
          <button className="header-action-btn"><Ico.User/><span className="label-text">Conta</span></button>
          <button className="header-action-btn" onClick={()=>setCartOpen(true)}><Ico.Cart/><span className="label-text">Carrinho</span>{cartCount>0&&<div className="cart-badge">{cartCount}</div>}</button>
        </div>
      </div></header>

      {/* CAT NAV */}
      <nav className="category-nav"><div className="category-nav-inner">
        <button className={"cat-nav-item"+(page==="home"?" active":"")} onClick={()=>nav("home")}><Ico.Home/> Início</button>
        {CATEGORIES.map(cat=><button key={cat.id} className={"cat-nav-item"+(selCat&&selCat.id===cat.id?" active":"")} onClick={()=>nav("category",cat)}>{cat.icon} {cat.name}</button>)}
      </div></nav>

      {/* CONTENT */}
      <main className="main-content">

        {/* HOME */}
        {page==="home" && <>
          <div className="hero-banner">
            <div className="hero-tag">Novidades</div>
            <h1 className="hero-title">As Melhores Ferramentas para Seu Projeto</h1>
            <p className="hero-subtitle">Ferramentas profissionais das melhores marcas com preços imbatíveis. Entrega para todo o Brasil.</p>
            <button className="hero-btn" onClick={()=>nav("category",CATEGORIES[0])}>Ver Produtos <Ico.ChevRight/></button>
          </div>
          <div className="benefits-bar">
            <div className="benefit-item"><div className="benefit-icon"><Ico.Truck/></div><div className="benefit-text"><h4>Entrega p/ Todo Brasil</h4><p>Frete calculado no checkout</p></div></div>
            <div className="benefit-item"><div className="benefit-icon"><Ico.Shield/></div><div className="benefit-text"><h4>Compra Segura</h4><p>Site 100% protegido</p></div></div>
            <div className="benefit-item"><div className="benefit-icon"><Ico.Card/></div><div className="benefit-text"><h4>Até 12x Sem Juros</h4><p>No cartão de crédito</p></div></div>
            <div className="benefit-item"><div className="benefit-icon"><Ico.WA/></div><div className="benefit-text"><h4>Atendimento WhatsApp</h4><p>(27) 99825-5545</p></div></div>
          </div>
          <div className="section-header"><h2 className="section-title">Categorias</h2></div>
          <div className="category-grid">
            {CATEGORIES.filter(c=>c.id!==33).slice(0,10).map(cat=><div key={cat.id} className="category-card" onClick={()=>nav("category",cat)}><div className="category-icon">{cat.icon}</div><div className="category-label">{cat.name}</div></div>)}
          </div>
          <div className="section-header"><h2 className="section-title">Produtos em Destaque</h2><span className="section-link" onClick={()=>nav("category",CATEGORIES[1])}>Ver todos <Ico.ChevRight/></span></div>
          <div className="product-grid">
            {products.slice(0,8).map(p=><ProductCard key={p.id} product={p} onClick={p=>nav("product",p)} onAddToCart={addToCart}/>)}
          </div>
          <div className="section-header"><h2 className="section-title">Ofertas e Promoções</h2></div>
          <div className="product-grid">
            {products.filter(p=>p.promotional_price>0&&p.promotional_price<p.price).slice(0,4).map(p=><ProductCard key={p.id} product={p} onClick={p=>nav("product",p)} onAddToCart={addToCart}/>)}
          </div>
        </>}

        {/* CATEGORY */}
        {page==="category" && selCat && <>
          <button className="back-btn" onClick={()=>nav("home")}><Ico.ArrowL/> Voltar</button>
          <div className="section-header"><h2 className="section-title">{selCat.icon} {selCat.name}</h2></div>
          <div className="category-page-layout">
            <aside className="filter-sidebar">
              <div className="filter-title">Filtros</div>
              {selCat.children.length>0 && <div className="filter-group"><h4>Subcategorias</h4>{selCat.children.map(ch=><label key={ch.id} className="filter-option"><input type="checkbox"/> {ch.name}</label>)}</div>}
              <div className="filter-group"><h4>Ordenar</h4><select className="sort-select" value={sortBy} onChange={e=>setSortBy(e.target.value)}><option value="relevance">Relevância</option><option value="price-asc">Menor Preço</option><option value="price-desc">Maior Preço</option><option value="name">Nome A-Z</option></select></div>
              <div className="filter-group"><h4>Marca</h4>{["DeWalt","Bosch","Makita","Tramontina","Stanley"].map(b=><label key={b} className="filter-option"><input type="checkbox"/> {b}</label>)}</div>
            </aside>
            <div>
              {getFiltered(selCat.id).length > 0
                ? <div className="product-grid" style={{gridTemplateColumns:"repeat(3,1fr)"}}>{getFiltered(selCat.id).map(p=><ProductCard key={p.id} product={p} onClick={p=>nav("product",p)} onAddToCart={addToCart}/>)}</div>
                : <div style={{textAlign:"center",padding:60,color:"#888"}}><p style={{fontSize:48,marginBottom:16}}>🔍</p><p style={{fontSize:16,fontWeight:500}}>Nenhum produto nesta categoria.</p><p style={{fontSize:14,marginTop:8}}>{trayOk?"Tente outra categoria.":"Configure a API da Tray para carregar seus produtos."}</p></div>
              }
            </div>
          </div>
        </>}

        {/* PRODUCT */}
        {page==="product" && selProd && (()=>{
          const p = selProd;
          const hasP = p.promotional_price>0 && p.promotional_price<p.price;
          const dp = hasP ? p.promotional_price : p.price;
          const pix = dp * 0.95;
          const inst = Math.min(12, Math.max(1, Math.floor(dp/20)));
          const parentCat = CATEGORIES.find(c=>c.children.some(ch=>ch.id===p.category_id)||c.id===p.category_id);
          return <>
            <button className="back-btn" onClick={()=>selCat?nav("category",selCat):nav("home")}><Ico.ArrowL/> Voltar</button>
            <div className="product-detail">
              <div className="pd-image-area"><img src={getProductImage(p)} alt={p.name}/></div>
              <div className="pd-info">
                <div className="pd-breadcrumb"><span onClick={()=>nav("home")}>Início</span> <Ico.ChevRight/> {parentCat&&<><span onClick={()=>nav("category",parentCat)}>{parentCat.name}</span> <Ico.ChevRight/></>} <span>{p.name}</span></div>
                <div className="pd-brand">{p.brand}</div>
                <h1 className="pd-name">{p.name}</h1>
                <div className="pd-sku">REF: VAL-{String(p.id).padStart(6,"0")}</div>
                <div className="pd-stars">{[1,2,3,4,5].map(i=><Ico.Star key={i} f={i<=4}/>)}<span style={{fontSize:12,color:"#888",marginLeft:4}}>(4.0)</span></div>
                <div className="pd-price-area">
                  {hasP && <div className="pd-old-price">de {formatPrice(p.price)}</div>}
                  <div className="pd-price">{formatPrice(dp)}</div>
                  {inst>1 && <div className="pd-installments">até <strong>{inst}x de {formatPrice(dp/inst)}</strong> sem juros</div>}
                  <div className="pd-pix">{formatPrice(pix)} no PIX (5% de desconto)</div>
                </div>
                <div className="pd-stock"><span className="dot"/> Em estoque — {p.stock||"10+"} unidades</div>
                <div className="pd-buttons">
                  <button className="pd-add-cart" onClick={()=>addToCart(p)}>Adicionar ao Carrinho</button>
                  <button className="pd-buy-now" onClick={()=>{addToCart(p);handleCheckout();}}>Comprar Agora</button>
                </div>
                <div className="pd-desc"><h3>Descrição</h3><p>{p.description||"Produto de alta qualidade disponível na Ferramentas Valfre."}</p></div>
              </div>
            </div>
            <div className="section-header" style={{marginTop:24}}><h2 className="section-title">Produtos Relacionados</h2></div>
            <div className="product-grid">{products.filter(x=>x.id!==p.id).slice(0,4).map(x=><ProductCard key={x.id} product={x} onClick={x=>nav("product",x)} onAddToCart={addToCart}/>)}</div>
          </>;
        })()}

        {/* SEARCH */}
        {page==="search" && <>
          <button className="back-btn" onClick={()=>nav("home")}><Ico.ArrowL/> Voltar</button>
          <div className="section-header"><h2 className="section-title">Resultados para "{search}" ({searchRes?.length||0})</h2></div>
          {searchRes&&searchRes.length>0 ? <div className="product-grid">{searchRes.map(p=><ProductCard key={p.id} product={p} onClick={p=>nav("product",p)} onAddToCart={addToCart}/>)}</div>
          : <div style={{textAlign:"center",padding:60,color:"#888"}}><p style={{fontSize:48}}>🔍</p><p style={{fontSize:16,fontWeight:500,marginTop:16}}>Nenhum produto encontrado.</p></div>}
        </>}

        {/* POLICIES */}
        {policyPages.includes(page) && <PolicyPage type={page} navigate={nav}/>}
      </main>

      {/* FOOTER */}
      <footer className="footer">
        <div className="footer-inner">
          <div className="footer-brand">
            <h3><span>VAL</span>FRE</h3>
            <p>Ferramentas Valfre — Sua loja de ferramentas e equipamentos profissionais.</p>
            <p style={{fontSize:12}}>CNPJ: {CONFIG.CNPJ}</p>
            <div className="footer-social" style={{marginTop:12}}>
              <a href={CONFIG.WHATSAPP_URL} target="_blank"><Ico.WA/></a>
              <a href={CONFIG.INSTAGRAM_URL} target="_blank"><Ico.IG/></a>
            </div>
          </div>
          <div className="footer-col"><h4>Institucional</h4><ul>
            <li><a onClick={()=>nav("termos-de-uso")}>Termos de Uso</a></li>
            <li><a onClick={()=>nav("politica-de-privacidade")}>Política de Privacidade</a></li>
            <li><a onClick={()=>nav("politica-de-trocas")}>Trocas e Devoluções</a></li>
            <li><a onClick={()=>nav("politica-de-entrega")}>Política de Entrega</a></li>
            <li><a onClick={()=>nav("politica-de-pagamento")}>Formas de Pagamento</a></li>
          </ul></div>
          <div className="footer-col"><h4>Categorias</h4><ul>
            {CATEGORIES.slice(0,6).map(c=><li key={c.id}><a onClick={()=>nav("category",c)}>{c.name}</a></li>)}
          </ul></div>
          <div className="footer-col"><h4>Atendimento</h4><ul>
            <li><a href={CONFIG.WHATSAPP_URL} target="_blank">WhatsApp: (27) 99825-5545</a></li>
            <li><a href={CONFIG.INSTAGRAM_URL} target="_blank">Instagram: {CONFIG.INSTAGRAM}</a></li>
            <li><a>Seg à Sex: 8h às 18h</a></li>
            <li><a>Sáb: 8h às 12h</a></li>
          </ul></div>
        </div>
        <div className="footer-bottom"><p>© 2026 Ferramentas Valfre — CNPJ: {CONFIG.CNPJ} — Todos os direitos reservados.</p></div>
      </footer>

      {/* CART */}
      <div className={"cart-overlay"+(cartOpen?" open":"")} onClick={()=>setCartOpen(false)}/>
      <div className={"cart-sidebar"+(cartOpen?" open":"")}>
        <div className="cart-header"><h2>Carrinho ({cartCount})</h2><button className="cart-close" onClick={()=>setCartOpen(false)}>✕</button></div>
        {cart.length===0
          ? <div className="cart-empty"><span>🛒</span><p>Seu carrinho está vazio</p><button className="product-add-btn" style={{width:"auto",padding:"10px 24px"}} onClick={()=>{setCartOpen(false);nav("home")}}>Continuar Comprando</button></div>
          : <><div className="cart-items">{cart.map(item=>{
              const ip = item.promotional_price>0&&item.promotional_price<item.price?item.promotional_price:item.price;
              return <div key={item.id} className="cart-item">
                <div className="cart-item-img"><img src={getProductImage(item)} alt={item.name}/></div>
                <div className="cart-item-info">
                  <div className="cart-item-name">{item.name}</div>
                  <div className="cart-item-price">{formatPrice(ip*item.quantity)}</div>
                  <div className="cart-item-actions">
                    <div className="cart-item-qty"><button onClick={()=>updateQty(item.id,-1)}>−</button><span>{item.quantity}</span><button onClick={()=>updateQty(item.id,1)}>+</button></div>
                    <button className="cart-item-remove" onClick={()=>removeItem(item.id)}>🗑</button>
                  </div>
                </div>
              </div>;
            })}</div>
            <div className="cart-footer">
              <div className="cart-total"><span className="cart-total-label">Total:</span><span className="cart-total-value">{formatPrice(cartTotal)}</span></div>
              <button className="cart-checkout-btn" onClick={handleCheckout}>Finalizar Compra</button>
              <button className="cart-continue" onClick={()=>setCartOpen(false)}>Continuar Comprando</button>
            </div>
          </>
        }
      </div>

      {/* MOBILE MENU */}
      <div className={"mobile-menu-overlay"+(mobileMenu?" open":"")} onClick={()=>setMobileMenu(false)}/>
      <div className={"mobile-menu"+(mobileMenu?" open":"")}>
        <div className="mobile-menu-header"><h3>Menu</h3><button className="mobile-menu-close" onClick={()=>setMobileMenu(false)}>✕</button></div>
        <div style={{padding:12,borderBottom:"1px solid #E8E8E8"}}><div style={{position:"relative"}}><input className="search-input" style={{background:"#F5F5F5",color:"#1A1A1A",width:"100%"}} placeholder="Buscar..." value={search} onChange={e=>setSearch(e.target.value)} onKeyDown={e=>{if(e.key==="Enter"){doSearch();setMobileMenu(false)}}}/><button className="search-btn" onClick={()=>{doSearch();setMobileMenu(false)}}><Ico.Search/></button></div></div>
        <div>
          <button className="mobile-cat-item" onClick={()=>nav("home")}>🏠 Início</button>
          {CATEGORIES.map(cat=><div key={cat.id}>
            <button className="mobile-cat-item" onClick={()=>{if(cat.children.length)setExpandedCats(p=>({...p,[cat.id]:!p[cat.id]}));else nav("category",cat)}}>
              <span>{cat.icon} {cat.name}</span>{cat.children.length>0&&(expandedCats[cat.id]?<Ico.ChevDown/>:<Ico.ChevRight/>)}
            </button>
            {expandedCats[cat.id]&&cat.children.length>0&&<div className="mobile-cat-children">
              <button className="mobile-cat-child" onClick={()=>nav("category",cat)}>Ver Todos</button>
              {cat.children.map(ch=><button key={ch.id} className="mobile-cat-child" onClick={()=>nav("category",cat)}>{ch.name}</button>)}
            </div>}
          </div>)}
        </div>
        <div className="mobile-menu-links">
          <button className="mobile-link" onClick={()=>nav("termos-de-uso")}>Termos de Uso</button>
          <button className="mobile-link" onClick={()=>nav("politica-de-privacidade")}>Política de Privacidade</button>
          <button className="mobile-link" onClick={()=>nav("politica-de-trocas")}>Trocas e Devoluções</button>
          <button className="mobile-link" onClick={()=>nav("politica-de-entrega")}>Política de Entrega</button>
          <button className="mobile-link" onClick={()=>nav("politica-de-pagamento")}>Formas de Pagamento</button>
        </div>
        <div style={{padding:16,borderTop:"1px solid #E8E8E8"}}><a href={CONFIG.WHATSAPP_URL} target="_blank" style={{display:"flex",alignItems:"center",gap:8,color:"#25D366",textDecoration:"none",fontWeight:600,fontSize:14}}><Ico.WA/> (27) 99825-5545</a></div>
      </div>

      {/* WHATSAPP FLOAT */}
      <a href={CONFIG.WHATSAPP_URL} target="_blank" className="whatsapp-float" title="WhatsApp"><Ico.WA/></a>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
