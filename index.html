        <>
          <button className="back-btn" onClick={()=>sC?nav("category",sC):nav("home")}><I.AL/> Voltar</button>
          <div className="pd-wrap">
            <div className="pd-img"><img src={gImg(p)} alt={p.name}/></div>
            <div className="pd-info">
              <div className="pd-bc"><span onClick={()=>nav("home")}>Início</span> › {pc&&<><span onClick={()=>nav("category",pc)}>{pc.name}</span> › </>}<span>{p.name}</span></div>
              <div className="pd-brand">{p.brand}</div>
              <h1 className="pd-name">{p.name}</h1>
              <div className="pd-sku">REF: VAL-{String(p.id).padStart(6,"0")}{p.ean&&` | EAN: ${p.ean}`}</div>
              <div style={{display:"flex",gap:2,marginBottom:10}}>{[1,2,3,4,5].map(i=><I.St key={i} f={i<=4}/>)}<span style={{fontSize:10,color:"#888",marginLeft:4}}>(4.0)</span></div>
              <div className="pd-pa">
                {hp&&<div className="pd-olp">de {fmt(p.price)}</div>}
                <div className="pd-pr">{fmt(dp)}</div>
                {inst>1&&<div className="pd-inst">ou até <b>{inst}x de {fmt(dp/inst)}</b> sem juros</div>}
                <div className="pd-pix">{fmt(pix)} à vista no PIX (10% desc.)</div>
              </div>
              {oos?
                <>
                  <div className={"pd-stk out"}><span className="dot"/> Produto indisponível</div>
                  <OOSNotify/>
                </>
                :
                <>
                  <div className={"pd-stk in"}><span className="dot"/> Em estoque{p.stock?` — ${p.stock} un`:""}</div>
                  <div className="pd-btns">
                    <button className="pd-ac" onClick={()=>addC(p)}>Adicionar ao Carrinho</button>
                    <button className="pd-bn" onClick={()=>{addC(p);ck();}}>Comprar Agora</button>
                  </div>
                </>
              }
              <FreteCalc/>
            </div>
          </div>

          <div style={{background:"#fff",borderRadius:16,padding:24,marginBottom:24}}>
            <div className="pd-tabs">
              <button className={"pd-tab"+(pdt==="desc"?" active":"")} onClick={()=>sPDT("desc")}>Descrição</button>
              <button className={"pd-tab"+(pdt==="ficha"?" active":"")} onClick={()=>sPDT("ficha")}>Ficha Técnica</button>
            </div>
            <div className="pd-tc">
              {pdt==="desc"&&<><h3>Descrição</h3><p>{p.description||"Produto disponível na Ferramentas Valfre."}</p></>}
              {pdt==="ficha"&&<>
                <h3>Ficha Técnica</h3>
                <table><tbody>
                  {p.brand&&<tr><td>Marca</td><td>{p.brand}</td></tr>}
                  {p.model&&<tr><td>Modelo</td><td>{p.model}</td></tr>}
                  {p.weight&&<tr><td>Peso</td><td>{p.weight}</td></tr>}
                  {p.warranty&&<tr><td>Garantia</td><td>{p.warranty}</td></tr>}
                  <tr><td>Disponibilidade</td><td>{oos?'Indisponível':'Em estoque'}</td></tr>
                </tbody></table>
              </>}
            </div>
          </div>

          <div className="sec-hdr"><h2 className="sec-title">Relacionados</h2></div>
          <div className="p-grid">{rel.map(x=><PC key={x.id} p={x} onClick={x=>nav("product",x)} onAdd={addC}/>)}</div>
        </>
      );
    })()}

    {pg==="search"&&(
      <>
        <button className="back-btn" onClick={()=>nav("home")}><I.AL/> Voltar</button>
        <div className="sec-hdr"><h2 className="sec-title">Resultados ({sr?.length||0})</h2></div>
        {sr?.length>0?<div className="p-grid">{sr.map(p=><PC key={p.id} p={p} onClick={p=>nav("product",p)} onAdd={addC}/>)}</div>:<div style={{textAlign:"center",padding:48,color:"#888"}}><p style={{fontSize:40}}>🔍</p><p>Nenhum produto encontrado.</p></div>}
      </>
    )}

    {(pg==="login"||pg==="cadastro")&&<AuthPage nav={nav} initTab={pg==="cadastro"?"cad":"login"}/>}
    {pg==="afiliados"&&(<div><button className="back-btn" onClick={()=>nav("home")}><I.AL/> Voltar</button><div className="pol-pg"><h1>💰 Programa de Afiliados Valfre</h1><p>Ganhe comissões vendendo nossos produtos!</p><h2>Como funciona?</h2><p>1. Cadastre-se como afiliado. 2. Receba seu link. 3. Compartilhe. 4. Ganhe comissão!</p><h2>Comissão: 3% a 15%</h2><p>WhatsApp <b>(27) 99825-5545</b> ou Instagram <b>{CFG.IG}</b>.</p></div></div>)}

    {["termos","privacidade","trocas","entrega","pagamento"].includes(pg)&&(()=>{
      const P={
        "termos":{t:"Termos de Uso",c:<><h2>1. Aceitação</h2><p>Ao acessar (CNPJ: {CFG.CNPJ}), você aceita estes termos.</p><h2>2. Preços</h2><p>Sujeitos a alteração.</p></>},
        "privacidade":{t:"Privacidade / LGPD",c:<><h2>Coleta</h2><p>Nome, CPF/CNPJ, endereço, e-mail, telefone. Acesse, corrija ou exclua: WhatsApp (27) 99825-5545.</p></>},
        "trocas":{t:"Trocas e Devoluções",c:<><h2>Arrependimento</h2><p>7 dias (Art. 49 CDC). Defeito: 30/90 dias.</p></>},
        "entrega":{t:"Entrega",c:<><h2>Cobertura</h2><p>Todo o Brasil. SE: 3-7 dias. S/NE: 5-12. N/CO: 7-15 dias úteis.</p></>},
        "pagamento":{t:"Pagamento",c:<><h2>Aceitos</h2><p>Cartões, débito, PIX (10% desc.), boleto. Até 12x sem juros.</p></>}
      };
      const pol=P[pg]; if(!pol)return null;
      return(<div><button className="back-btn" onClick={()=>nav("home")}><I.AL/> Voltar</button><div className="pol-pg"><h1>{pol.t}</h1>{pol.c}</div></div>);
    })()}
  </main>

  <footer className="footer">
    <div className="footer-inner">
      <div className="f-brand">
        <h3><span>FERRAMENTAS</span> VALFRE</h3>
        <p>Ferramentas e equipamentos profissionais.</p>
        <p style={{fontSize:11}}>CNPJ: {CFG.CNPJ}</p>
        <div className="f-social" style={{marginTop:8}}>
          <a href={CFG.WA_URL} target="_blank"><I.W/></a>
          <a href={CFG.IG_URL} target="_blank"><I.IG/></a>
        </div>
        <div className="app-badges-ft">
          <a className="app-badge-ft" href="#">🍎 App Store</a>
          <a className="app-badge-ft" href="#">▶️ Google Play</a>
        </div>
      </div>
      <div className="f-col"><h4>Institucional</h4><ul><li><a onClick={()=>nav("termos")}>Termos de Uso</a></li><li><a onClick={()=>nav("privacidade")}>Privacidade / LGPD</a></li><li><a onClick={()=>nav("trocas")}>Trocas e Devoluções</a></li><li><a onClick={()=>nav("entrega")}>Entrega</a></li><li><a onClick={()=>nav("pagamento")}>Pagamento</a></li><li><a onClick={()=>nav("afiliados")}>Afiliados</a></li></ul></div>
      <div className="f-col"><h4>Categorias</h4><ul>{CATS.filter(c=>c.id!==33&&c.id!==35).slice(0,6).map(c=><li key={c.id}><a onClick={()=>nav("category",c)}>{c.name}</a></li>)}</ul></div>
      <div className="f-col"><h4>Atendimento</h4><ul><li><a href={CFG.WA_URL} target="_blank">(27) 99825-5545</a></li><li><a href={CFG.IG_URL} target="_blank">{CFG.IG}</a></li><li><a>Seg-Sex: 8h-18h</a></li><li><a onClick={()=>nav("afiliados")}>Seja Afiliado</a></li></ul></div>
    </div>
    <div className="f-btm"><p>© 2026 Ferramentas Valfre — CNPJ: {CFG.CNPJ} — Todos os direitos reservados.</p></div>
  </footer>

  <div className={"c-ov"+(cO?" open":"")} onClick={()=>sCO(false)}/>
  <div className={"c-sb"+(cO?" open":"")}>
    <div className="c-hdr"><h2>Carrinho ({cCnt})</h2><button className="c-close" onClick={()=>sCO(false)}>✕</button></div>
    {cart.length===0?
      <div className="c-empty"><span style={{fontSize:40}}>🛒</span><p>Vazio</p><button className="p-btn" style={{width:"auto",padding:"10px 20px"}} onClick={()=>{sCO(false);nav("home")}}>Comprar</button></div>
      :
      <>
        <div className="c-items">
          {cart.map(i=>{
            const ip=i.promotional_price>0&&i.promotional_price<i.price?i.promotional_price:i.price;
            return(
              <div key={i.id} className="c-item">
                <div className="c-iimg"><img src={gImg(i)} alt={i.name}/></div>
                <div className="c-iinfo">
                  <div className="c-iname">{i.name}</div>
                  <div className="c-iprice">{fmt(ip*i.quantity)}</div>
                  <div className="c-iacts">
                    <div className="c-iqty"><button onClick={()=>uQ(i.id,-1)}>−</button><span>{i.quantity}</span><button onClick={()=>uQ(i.id,1)}>+</button></div>
                    <button className="c-irm" onClick={()=>rI(i.id)}>🗑</button>
                  </div>
                </div>
              </div>
            );
          })}
        </div>
        <div className="c-ftr">
          <div className="c-total"><span className="c-tlbl">Total:</span><span className="c-tval">{fmt(cTot)}</span></div>
          <button className="c-ckbtn" onClick={ck}>Finalizar Compra</button>
          <button className="c-cont" onClick={()=>sCO(false)}>Continuar Comprando</button>
        </div>
      </>
    }
  </div>

  <div className={"mega-ov"+(mm?" open":"")} onClick={()=>sMM(false)}/>
  <div className={"mega-menu"+(mm?" open":"")}>
    <div className="mg-hdr"><h3>Menu</h3><button className="mg-close" onClick={()=>sMM(false)}>✕</button></div>
    <div style={{padding:8,borderBottom:"1px solid #E8E8E8"}}>
      <div style={{position:"relative"}}>
        <input style={{background:"#F5F5F5",width:"100%",padding:"10px 44px 10px 12px",border:"none",borderRadius:8,fontFamily:"Outfit",fontSize:13}} placeholder="Buscar..." value={sq} onChange={e=>sSQ(e.target.value)} onKeyDown={e=>{if(e.key==="Enter"){doS();sMM(false)}}}/>
        <button className="s-btn" onClick={()=>{doS();sMM(false)}}><I.S/></button>
      </div>
    </div>
    <div>
      <button className="mg-btn" onClick={()=>nav("home")}>🏠 Início</button>
      {CATS.map(c=><div key={c.id}><button className="mg-btn" onClick={()=>{if(c.ch.length)sEC(p=>({...p,[c.id]:!p[c.id]}));else{nav("category",c);sMM(false);}}}><span>{c.icon} {c.name}</span>{c.ch.length>0&&(ec[c.id]?<I.D/>:<I.R/>)}</button>{c.ch.length>0&&<div className={"mg-subs"+(ec[c.id]?" open":"")}><button className="mg-sub-link" onClick={()=>{nav("category",c);sMM(false);}}>Ver Todos</button>{c.ch.map(ch=><button key={ch.id} className="mg-sub-link" onClick={()=>{nav("category",c,ch);sMM(false);}}>{ch.name}</button>)}</div>}</div>)}
    </div>
    <div style={{borderTop:"1px solid #E8E8E8",padding:10}}><a href={CFG.WA_URL} target="_blank" style={{display:"flex",alignItems:"center",gap:6,color:"#25D366",textDecoration:"none",fontWeight:600,fontSize:13}}><I.W/> (27) 99825-5545</a></div>
  </div>

  {alrt&&<div className="alert-pop"><button className="a-close" onClick={()=>sAlrt(false)}>×</button><h4>🔔 Ferramentas Valfre</h4><p>Receba ofertas e cupons! Clique em <b>aceitar</b>.</p><div className="alert-btns"><button className="a-dis" onClick={()=>sAlrt(false)}>Não</button><button className="a-acc" onClick={()=>sAlrt(false)}>ACEITAR</button></div></div>}
  <a href={CFG.WA_URL} target="_blank" className="wa-float"><I.W/></a>
</div>
);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
