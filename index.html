<div className="sec-hdr"><h2 className="sec-title">Relacionados</h2></div><div className="p-grid">{rel.map(x=><PC key={x.id} p={x} onClick={x=>nav("product",x)} onAdd={addC}/>)}</div></>;})()}

{pg==="search"&&<><button className="back-btn" onClick={()=>nav("home")}><I.AL/> Voltar</button><div className="sec-hdr"><h2 className="sec-title">Resultados ({sr?.length||0})</h2></div>{sr?.length>0?<div className="p-grid">{sr.map(p=><PC key={p.id} p={p} onClick={p=>nav("product",p)} onAdd={addC}/>)}</div>:<div style={{textAlign:"center",padding:48,color:"#888"}}><p style={{fontSize:40}}>🔍</p><p style={{marginTop:12}}>Nenhum produto.</p></div>}</>}
{/* AFFILIATE */}
{pg==="afiliados"&&<div><button className="back-btn" onClick={()=>nav("home")}><I.AL/> Voltar</button><div className="pol-pg"><h1>💰 Programa de Afiliados Valfre</h1><p>Ganhe comissões vendendo produtos da Ferramentas Valfre! Cadastre-se gratuitamente e comece a lucrar.</p><h2>Como funciona?</h2><p>1. Cadastre-se como afiliado (CPF ou CNPJ).</p><p>2. Receba seu link exclusivo de divulgação.</p><p>3. Compartilhe nas redes sociais, WhatsApp, blog ou YouTube.</p><p>4. A cada venda realizada pelo seu link, você ganha comissão!</p><h2>Comissão Variável</h2><p>A comissão é <b>variável</b> e depende da categoria do produto. Os percentuais vão de <b>3% a 15%</b> sobre o valor da venda. Produtos com maior margem oferecem comissões mais atrativas. Consulte os valores no painel do afiliado após cadastro.</p><h2>Quem pode participar?</h2><p>Pessoa física (CPF) ou jurídica (CNPJ). Sem necessidade de estoque — nós cuidamos de entrega, pagamento e suporte.</p><h2>Termos do Programa</h2><p>• Comissão paga após confirmação da entrega ao cliente.</p><p>• Proibido usar o nome Ferramentas Valfre em anúncios pagos sem autorização.</p><p>• O afiliado não pode oferecer descontos não autorizados.</p><p>• Percentuais podem ser alterados com aviso prévio de 15 dias.</p><p>• Vendas canceladas, devolvidas ou com chargeback não geram comissão.</p><p>• Pagamento mensal via PIX ou transferência.</p><p>• A parceria pode ser encerrada em caso de violação dos termos.</p><h2>Cadastre-se!</h2><p>WhatsApp <b>(27) 99825-5545</b> ou Instagram <b>{CFG.IG}</b>. Envie: nome, CPF/CNPJ, e-mail, telefone.</p></div></div>}
{/* POLICIES */}
{pols.includes(pg)&&(()=>{const P={"termos":{t:"Termos de Uso",c:<><h2>1. Aceitação</h2><p>Ao acessar (CNPJ: {CFG.CNPJ}), você aceita estes termos.</p><h2>2. Uso</h2><p>Venda de ferramentas. Uso para fins legais.</p><h2>3. Preços</h2><p>Sujeitos a alteração.</p></>},"privacidade":{t:"Privacidade / LGPD",c:<><h2>1. Coleta</h2><p>Nome, CPF/CNPJ, endereço, e-mail, telefone.</p><h2>2. LGPD</h2><p>Acesse, corrija ou exclua dados: WhatsApp (27) 99825-5545.</p></>},"trocas":{t:"Trocas e Devoluções",c:<><h2>1. Arrependimento</h2><p>7 dias (Art. 49 CDC).</p><h2>2. Defeito</h2><p>30/90 dias conforme CDC.</p></>},"entrega":{t:"Entrega",c:<><h2>Cobertura</h2><p>Todo o Brasil. SE: 3-7 dias. S/NE: 5-12. N/CO: 7-15 dias úteis.</p></>},"pagamento":{t:"Pagamento",c:<><h2>Aceitos</h2><p>Cartões, débito, PIX (10% desc.), boleto. Até 12x sem juros.</p></>}};const pol=P[pg];if(!pol)return null;return<div><button className="back-btn" onClick={()=>nav("home")}><I.AL/> Voltar</button><div className="pol-pg"><h1>{pol.t}</h1>{pol.c}<p style={{marginTop:16,fontSize:11,color:"#888"}}>CNPJ: {CFG.CNPJ}</p></div></div>})()}
</main>
{/* FOOTER */}
<footer className="footer"><div className="footer-inner"><div className="f-brand"><h3><span>FERRAMENTAS</span> VALFRE</h3><p>Ferramentas e equipamentos profissionais.</p><p style={{fontSize:11}}>CNPJ: {CFG.CNPJ}</p><div className="f-social" style={{marginTop:8}}><a href={CFG.WA_URL} target="_blank"><I.W/></a><a href={CFG.IG_URL} target="_blank"><I.IG/></a></div></div><div className="f-col"><h4>Institucional</h4><ul><li><a onClick={()=>nav("termos")}>Termos de Uso</a></li><li><a onClick={()=>nav("privacidade")}>Privacidade / LGPD</a></li><li><a onClick={()=>nav("trocas")}>Trocas e Devoluções</a></li><li><a onClick={()=>nav("entrega")}>Entrega</a></li><li><a onClick={()=>nav("pagamento")}>Pagamento</a></li><li><a onClick={()=>nav("afiliados")}>Afiliados</a></li></ul></div><div className="f-col"><h4>Categorias</h4><ul>{CATS.slice(0,6).map(c=><li key={c.id}><a onClick={()=>nav("category",c)}>{c.name}</a></li>)}</ul></div><div className="f-col"><h4>Atendimento</h4><ul><li><a href={CFG.WA_URL} target="_blank">(27) 99825-5545</a></li><li><a href={CFG.IG_URL} target="_blank">{CFG.IG}</a></li><li><a>Seg-Sex: 8h-18h</a></li><li><a onClick={()=>nav("afiliados")}>Seja Afiliado</a></li></ul></div></div><div className="f-btm"><p>© 2026 Ferramentas Valfre — CNPJ: {CFG.CNPJ} — Todos os direitos reservados.</p></div></footer>
{/* CART */}
<div className={"c-ov"+(cO?" open":"")} onClick={()=>sCO(false)}/><div className={"c-sb"+(cO?" open":"")}><div className="c-hdr"><h2>Carrinho ({cCnt})</h2><button className="c-close" onClick={()=>sCO(false)}>✕</button></div>{cart.length===0?<div className="c-empty"><span style={{fontSize:40}}>🛒</span><p>Vazio</p><button className="p-btn" style={{width:"auto",padding:"10px 20px"}} onClick={()=>{sCO(false);nav("home")}}>Comprar</button></div>:<><div className="c-items">{cart.map(i=>{const ip=i.promotional_price>0&&i.promotional_price<i.price?i.promotional_price:i.price;return<div key={i.id} className="c-item"><div className="c-iimg"><img src={gImg(i)} alt={i.name}/></div><div className="c-iinfo"><div className="c-iname">{i.name}</div><div className="c-iprice">{fmt(ip*i.quantity)}</div><div className="c-iacts"><div className="c-iqty"><button onClick={()=>uQ(i.id,-1)}>−</button><span>{i.quantity}</span><button onClick={()=>uQ(i.id,1)}>+</button></div><button className="c-irm" onClick={()=>rI(i.id)}>🗑</button></div></div></div>})}</div><div className="c-ftr"><div className="c-total"><span className="c-tlbl">Total:</span><span className="c-tval">{fmt(cTot)}</span></div><button className="c-ckbtn" onClick={ck}>Finalizar Compra</button><button className="c-cont" onClick={()=>sCO(false)}>Continuar Comprando</button></div></>}</div>

<div className={"mm-ov"+(mm?" open":"")} onClick={()=>sMM(false)}/><div className={"mm"+(mm?" open":"")}><div className="mm-hdr"><h3>Menu</h3><button className="mm-close" onClick={()=>sMM(false)}>✕</button></div><div style={{padding:8,borderBottom:"1px solid #E8E8E8"}}><div style={{position:"relative"}}><input className="search-box" style={{background:"#F5F5F5",color:"#1A1A1A",width:"100%",padding:"10px 44px 10px 12px",border:"none",borderRadius:8,fontFamily:"Outfit",fontSize:13}} placeholder="Buscar..." value={sq} onChange={e=>sSQ(e.target.value)} onKeyDown={e=>{if(e.key==="Enter"){doS();sMM(false)}}}/><button className="s-btn" onClick={()=>{doS();sMM(false)}} style={{borderRadius:"0 8px 8px 0"}}><I.S/></button></div></div><div><button className="mm-ci" onClick={()=>nav("home")}>🏠 Início</button>{CATS.map(c=><div key={c.id}><button className="mm-ci" onClick={()=>{if(c.ch.length)sEC(p=>({...p,[c.id]:!p[c.id]}));else nav("category",c)}}><span>{c.icon} {c.name}</span>{c.ch.length>0&&(ec[c.id]?<I.D/>:<I.R/>)}</button>{ec[c.id]&&c.ch.length>0&&<div className="mm-cc"><button className="mm-ch" onClick={()=>nav("category",c)}>Ver Todos</button>{c.ch.map(ch=><button key={ch.id} className="mm-ch" onClick={()=>nav("category",c)}>{ch.name}</button>)}</div>}</div>)}</div><div className="mm-links"><button className="mm-link" onClick={()=>nav("afiliados")}>💰 Afiliados</button><button className="mm-link" onClick={()=>nav("termos")}>Termos</button><button className="mm-link" onClick={()=>nav("privacidade")}>Privacidade</button><button className="mm-link" onClick={()=>nav("trocas")}>Trocas</button><button className="mm-link" onClick={()=>nav("entrega")}>Entrega</button><button className="mm-link" onClick={()=>nav("pagamento")}>Pagamento</button></div><div style={{padding:10,borderTop:"1px solid #E8E8E8"}}><a href={CFG.WA_URL} target="_blank" style={{display:"flex",alignItems:"center",gap:6,color:"#25D366",textDecoration:"none",fontWeight:600,fontSize:13}}><I.W/> (27) 99825-5545</a></div></div>
{/* ALERT */}
{alrt&&<div className="alert-pop"><button className="a-close" onClick={()=>sAlrt(false)}>×</button><h4>🔔 ALERTA FERRAMENTAS VALFRE!</h4><p>Receba ofertas e cupons em primeira mão. Ative as notificações. É rápido: Clique em <b>aceitar</b>!</p><div className="alert-btns"><button className="a-dis" onClick={()=>{sAlrt(false);try{window.localStorage.setItem("valfre_alert_seen","1")}catch(e){}}}>Não, obrigado</button><button className="a-acc" onClick={()=>{sAlrt(false);try{window.localStorage.setItem("valfre_alert_seen","1")}catch(e){}}}>ACEITAR</button></div></div>}
{/* WA FLOAT */}
<a href={CFG.WA_URL} target="_blank" className="wa-float"><I.W/></a>
</div>}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
