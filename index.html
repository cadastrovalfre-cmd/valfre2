<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=5.0"/>
<meta name="theme-color" content="#1B3A5C"/>
<title>Ferramentas Valfre</title>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
body{font-family:Arial;background:#F8F6F3;margin:0}
.p-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding:40px}
.p-card{background:#fff;border-radius:10px;padding:10px;border:1px solid #eee}
.p-card img{width:100%;height:160px;object-fit:contain}
.p-name{font-size:14px;margin:6px 0}
.p-price{font-weight:700;color:#E87A1D}
</style>
</head>

<body>

<div id="root"></div>

<script type="text/babel">

const CFG={
TRAY_URL:"https://1225878.commercesuite.com.br/web_api",
TRAY_TOKEN:"APP_ID-8121-STORE_ID-1225878-464d23e42df2f900d9c32d418123027440d40443cc662d5c2a77d23cf4409f7d",
TRAY_SID:"1225878"
}

const fmt=p=>new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"}).format(p)

const TrayAPI={

 async get(limit=50){

  try{

   const r = await fetch(
    CFG.TRAY_URL +
    "/products/?access_token=" +
    CFG.TRAY_TOKEN +
    "&limit=" + limit +
    "&page=1"
   )

   return await r.json()

  }catch(e){
   console.log("Erro Tray API",e)
   return null
  }

 },

 parse(p){

  let img=null

  if(p.ProductImage && p.ProductImage.length>0){
   img=p.ProductImage[0].https || p.ProductImage[0].http
  }

  return{
   id:+p.id,
   name:p.name,
   price:+p.price,
   promotional_price:+p.promotional_price,
   brand:p.brand,
   image:img
  }

 }

}

function ProductCard({p}){

 const price = p.promotional_price>0 ? p.promotional_price : p.price

 return(
  <div className="p-card">
   <img src={p.image} />
   <div className="p-name">{p.name}</div>
   <div className="p-price">{fmt(price)}</div>
  </div>
 )

}

function App(){

 const [products,setProducts]=React.useState([])

 React.useEffect(()=>{

  TrayAPI.get(50).then(data=>{

   if(!data || !data.Products) return

   const list = data.Products.map(x=>TrayAPI.parse(x.Product))

   setProducts(list)

  })

 },[])

 return(
  <div>

   <h1 style={{padding:20}}>Ferramentas Valfre</h1>

   <div className="p-grid">
    {products.map(p=>
      <ProductCard key={p.id} p={p}/>
    )}
   </div>

  </div>
 )

}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>)

</script>

</body>
</html>
